# .github/workflows/web-ci.yml
# Builds apps/web, runs its unit tests and its Playwright flows.
# Needs no secrets, no live 0G and no funds.
name: web-ci

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_ENABLE_LAB: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run --cwd apps/web test
      - name: Build
        run: bun run --cwd apps/web build
      - name: Install the browser
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Playwright flows
        run: bun run --cwd apps/web e2e
      - name: Keep the report when a flow fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7